[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarna"
dynamic = ["version"]
description = "A small, statically checked programming language with its own compiler, interpreter, and VM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
swarna = "swarna.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "swarna.__version__"}

[tool.setuptools.packages.find]
include = ["swarna*", "compiler*", "runtime*"]
