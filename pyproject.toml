[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarna"
version = "0.1.0"
description = "A small, statically checked programming language with its own compiler, interpreter, and VM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
swarna = "swarna.__main__:main"

[tool.setuptools.packages.find]
include = ["swarna*", "compiler*", "runtime*"]
